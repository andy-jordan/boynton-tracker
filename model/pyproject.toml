[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boynton"
version = "0.1.0"
description = "Monte Carlo estimate of Mike Boynton hitting 2 of 4 extension benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
boynton = "boynton.cli:main"

[tool.setuptools]
packages = ["boynton"]
